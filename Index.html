<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unicon Music — Личный кабинет</title>

<!-- Favicon (эта же иконка, что в кабинете) -->
<link rel="icon" type="image/png" href="https://drive.google.com/uc?id=1ZK_mVvEviHze5Nqe-2iEgTR6HDn7_898&export=download&format=png">
<link rel="apple-touch-icon" href="https://drive.google.com/uc?id=1ZK_mVvEviHze5Nqe-2iEgTR6HDn7_898&export=download&format=png">

<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unicon Music">
<meta name="mobile-web-app-capable" content="yes">

<style>
  *,*::before,*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07070a;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }

  /* Загрузочный экран, пока iframe грузится */
  #loader{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:radial-gradient(circle at 50% 30%,#14111d 0%,#07070a 70%);
    transition:opacity .45s ease,visibility .45s ease;
  }
  #loader.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .loader-logo{
    width:64px;
    height:64px;
    border-radius:18px;
    display:grid;
    place-items:center;
    font-size:30px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    box-shadow:0 0 40px rgba(139,92,246,0.55);
    animation:logoPulse 2s ease-in-out infinite;
  }
  @keyframes logoPulse{
    0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(139,92,246,0.55)}
    50%{transform:scale(1.06);box-shadow:0 0 60px rgba(139,92,246,0.85)}
  }
  .loader-spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(139,92,246,0.22);
    border-top-color:#8b5cf6;
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{
    font-size:13px;
    color:#71717a;
    letter-spacing:.05em;
    font-weight:500;
  }

  /* Полноэкранный iframe */
  #app-frame{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#07070a;
  }

  /* Скрываем сплэш-экран Google внутри iframe, если он появляется */
  #app-frame::before{
    content:'';
  }
</style>
</head>
<body>

<!-- Экран загрузки — исчезает, как только iframe полностью загружен -->
<div id="loader">
  <div class="loader-logo">U</div>
  <div class="loader-spinner"></div>
  <div class="loader-text">Загрузка кабинета…</div>
</div>

<!-- Основной контейнер приложения -->
<iframe
  id="app-frame"
  src="about:blank"
  allow="clipboard-write; clipboard-read"
  referrerpolicy="no-referrer-when-downgrade"
  loading="eager"
  title="Unicon Music — Личный кабинет"
></iframe>

<script>
  /* ------------------------------------------------------------------
     КОНФИГУРАЦИЯ
     URL развёрнутого веб-приложения Apps Script.
     Должен заканчиваться на /exec (боевой), а не /dev.
  ------------------------------------------------------------------ */
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzOhyEzX7L2De4VUO2lg8NhgeJ2aDBMDybFi255ON0WYKV6UcLW2iJUMT00sIIU8xs/exec';

  /* ------------------------------------------------------------------
     Логика обёртки
  ------------------------------------------------------------------ */
  (function(){
    var iframe = document.getElementById('app-frame');
    var loader = document.getElementById('loader');

    // 1. Пробрасываем все query-параметры из адресной строки обёртки
    //    в iframe. Это нужно, например, для ?admin=1 или ?token=...
    var extraQuery = window.location.search || '';
    var finalUrl = GAS_URL + extraQuery;

    // 2. Показываем предупреждение, если GAS_URL не настроен
    if(GAS_URL.indexOf('ВАШ_ДЛИННЫЙ_ИДЕНТИФИКАТОР') !== -1){
      document.body.innerHTML =
        '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;' +
        'background:#07070a;color:#fff;font-family:sans-serif;text-align:center;line-height:1.7;">' +
          '<div>' +
            '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>' +
            '<div style="font-size:20px;font-weight:700;margin-bottom:10px;">Не настроен адрес приложения</div>' +
            '<div style="color:#a1a1aa;font-size:14px;max-width:440px;">' +
              'Откройте файл <code style="background:rgba(139,92,246,0.15);padding:2px 8px;' +
              'border-radius:6px;color:#a78bfa;">index.html</code> и замените ' +
              '<code style="background:rgba(139,92,246,0.15);padding:2px 8px;' +
              'border-radius:6px;color:#a78bfa;">ВАШ_ДЛИННЫЙ_ИДЕНТИФИКАТОР</code> ' +
              'на ID вашего Google Apps Script веб-приложения.' +
            '</div>' +
          '</div>' +
        '</div>';
      return;
    }

    // 3. Скрываем лоадер, когда iframe загрузился
    iframe.addEventListener('load', function(){
      // Даём приложению ~250 мс дорисовать первый экран, чтобы не было мигания
      setTimeout(function(){
        loader.classList.add('hidden');
      }, 250);
    });

    // 4. Фолбэк: если load не сработал за 20 секунд — всё равно убираем лоадер
    setTimeout(function(){
      loader.classList.add('hidden');
    }, 20000);

    // 5. Загружаем iframe
    iframe.src = finalUrl;

    // 6. Прокидываем resize-события от родителя внутрь iframe,
    //    чтобы при повороте экрана приложение корректно пересчитало верстку
    window.addEventListener('resize', function(){
      try{
        iframe.contentWindow.postMessage({ type:'parentResize' }, '*');
      }catch(e){}
    });

    // 7. Прокидываем изменения темы ОС (dark/light) — по желанию
    if(window.matchMedia){
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var notifyScheme = function(){
        try{
          iframe.contentWindow.postMessage({
            type:'colorScheme',
            dark: mq.matches
          }, '*');
        }catch(e){}
      };
      if(mq.addEventListener) mq.addEventListener('change', notifyScheme);
      else if(mq.addListener) mq.addListener(notifyScheme);
    }

    // 8. Блокируем открытие ссылок в iframe на внешние домены:
    //    всё, что ведёт наружу, должно открываться в новой вкладке.
    //    (Работает только для ссылок без target="_blank" в самом GAS.)
    document.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a[target="_blank"]');
      if(a) e.stopPropagation();
    }, true);
  })();
</script>

</body>
</html>
